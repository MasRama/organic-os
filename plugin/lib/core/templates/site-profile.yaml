schema_version: 1  # brain layout version - the plugin checks this before operating
# organic-os site profile. One file per site. Edit freely; setup fills it.
site:
  url: ""                # https://example.com
  name: ""               # brand name
  sitemap: ""            # https://example.com/sitemap.xml
brand:
  voice: []              # e.g. ["first person", "short sentences", "facts before adjectives"]
  banned_phrases: []     # phrases the drafts must never use
  rulebook: ""           # free text: brand and editorial rules
  # readability_target: "grade 9-10"  # optional; ce-qa's readability hard check target (absence = grade 9-10)
  # properties: []       # optional; exact public property URLs (GitHub org/repo, LinkedIn page) the
  #                      # monthly entity-consistency audit compares - never guessed (absence = own site only)
# editorial:              # optional; the enforceable editorial-policy floor. ce-qa enforces these
#                         # as hard checks; free-text rules stay in brand.rulebook. Defaults are
#                         # canonical in core.contracts.editorial_policy; absent keys mean:
#   oversight_threshold: 7    # ce-editor's human-review-necessity score at or above this recommends
#                             # a human line-edit; onsite-publish surfaces it in the approval message
#   internal_links_min: 0     # minimum same-site links per draft; 0 = check off
#   external_links_max: null  # cap on external links per draft; null = no cap
#   images_min: 0             # minimum in-content images (or attached image briefs); 0 = check off
#   sourcing: key-claims      # key-claims (statistics + comparative claims need sources) | every-claim
#   require_reviewer_note: false  # true = draft notes must name a human reviewer before publish
audience:
  segments: []           # ICP segments
  geos: []               # e.g. ["IN", "US"]
  languages: ["en"]
keywords:
  targets: []            # seed target keywords/topics
competitors: []          # domains
operator_notes: []       # "what already works in this niche" - seeded to skillbook at setup
connectors:              # detected at setup: available | absent | unknown
  ga4: unknown
  gsc: unknown
  notion: unknown
  slack: unknown
  canva: unknown
google_ads:
  status: none           # none | explorer | basic | standard
  login_customer_id: ""
wordpress:
  endpoint: ""           # https://site.example/wp-json (empty = not connected)
  username: ""           # app-password user; the password itself lives OUTSIDE this repo
approval:
  channel: in-session    # in-session | telegram | slack | email | pr-merge
  telegram_chat_id: ""
runtime:
  mode: manual           # claude-scheduled | local | ci | manual
routines:
  daily: true
  weekly: true
  monthly: true
brain:
  mode: local            # git | local
  repo: ""               # git remote when mode: git
